# EasyAuth 的「问题反馈」模板 · 中文版（给 Gitee）。
# 放仓库**默认分支**的 .gitee/ISSUE_TEMPLATE/ 下。
# Gitee 只认这一份；GitHub 只读 .github/ISSUE_TEMPLATE/，那边是英文版。
# 注意：.gitee/ 下**不要**再放 ISSUE_TEMPLATE.md / ISSUE_TEMPLATE.zh-CN.md 单文件，
#   否则 Gitee 会按老式模板处理，忽略本目录下的表单选择器。
# 放仓库根目录或非默认分支都不生效。
# 刻意不写 assignees：Gitee 成员是 Megawatt、GitHub 成员是 MegawattJ，
#   填谁都会在另一侧静默忽略，索性留空。
name: 问题反馈
description: App 出错了、验证码不对，或者行为不符合预期。
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你花时间反馈。**你的宝贵意见和建议将是我继续前行的动力。**

        > **请勿粘贴真实的 2FA 密钥、恢复码，或带密钥的二维码截图。**issue 是公开且永久可见的，任何人都能看到——包括不怀好意的人。如果问题只有在用真实数据时才复现，请改发邮件到 support@easydebug.net。

  - type: input
    id: app-version
    attributes:
      label: EasyAuth 版本
      description: App 内「关于」页面可以看到，形如 1.0.0。
      placeholder: "例如：1.0.0"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 设备与系统
      description: 手机型号 + 系统版本。问题常常只出现在某个系统版本上。
      placeholder: "例如：小米 14 / Android 15"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 你做了什么、期望看到什么、实际得到什么。
      placeholder: |
        操作：……
        期望：……
        实际得到：……
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序写，越具体越容易定位。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: false

  - type: dropdown
    id: install-source
    attributes:
      label: 从哪里安装的
      description: 不同渠道分发的包可能不一致，能帮助排除问题。
      options:
        - GitHub Releases
        - Gitee Releases
        - GitCode
        - 其他（请在正文里说明）
    validations:
      required: false

  - type: dropdown
    id: language
    attributes:
      label: App 语言
      description: 出问题时 App 界面是哪种语言？
      options:
        - 简体中文
        - 繁體中文
        - English
        - 한국어
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交之前
      options:
        - label: 我已经搜过已有的 issue，没有找到类似问题。
          required: true
        - label: 我没有粘贴任何真实的 2FA 密钥、恢复码、二维码或个人数据。
          required: true
